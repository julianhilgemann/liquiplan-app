# Builds the single-file app from src/ and publishes it to GitHub Pages.
# The built file is served as index.html, so the site root opens it directly;
# the file name of the earlier single-file version stays reachable as well.
# If the build fails, nothing is deployed and the site keeps its last version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        run: node build.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          cp dist/index.html _site/Liquiditaetsplaner_20261114.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
